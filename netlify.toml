[build]
  publish = "public"
  command = "npm run build"
  functions = "netlify/functions"

# Redirect /tip/* to /tip/index.html for SPA routing
[[redirects]]
  from = "/tip/:musicianId"
  to = "/tip/index.html"
  status = 200

[[redirects]]
  from = "/tip/:musicianId/*"
  to = "/tip/:splat"
  status = 200

# Force HTTPS
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.stripe.com; frame-src https://checkout.stripe.com https://connect.stripe.com;"

# Cache static assets
[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/musicians/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Don't cache HTML pages
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Don't cache config file
[[headers]]
  for = "/musicians/config.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Environment variables (optional - can also be set in Netlify UI)
# [build.environment]
#   NODE_VERSION = "18"
