<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - Tip App</title>
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body class="min-h-screen bg-gray-50 py-8">
    <div class="max-w-4xl mx-auto px-4">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">QR Code Generator</h1>
            <p class="text-gray-600">Generate QR codes for musicians to receive tips</p>
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600 mx-auto"></div>
            <p class="mt-4 text-gray-600">Loading musicians...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden">
            <div class="bg-red-50 border border-red-200 rounded-lg p-6 text-center">
                <svg class="w-16 h-16 text-red-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <h2 class="text-xl font-bold text-red-900 mb-2">Error Loading Musicians</h2>
                <p id="error-message" class="text-red-700"></p>
            </div>
        </div>

        <!-- Musicians Grid -->
        <div id="musicians-grid" class="hidden grid gap-6 md:grid-cols-2 lg:grid-cols-2">
            <!-- Musician cards will be inserted here -->
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        (function() {
            'use strict';

            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const errorMessageEl = document.getElementById('error-message');
            const musiciansGridEl = document.getElementById('musicians-grid');

            // Show error
            function showError(message) {
                loadingEl.classList.add('hidden');
                musiciansGridEl.classList.add('hidden');
                errorMessageEl.textContent = message;
                errorEl.classList.remove('hidden');
            }

            // Show musicians
            function showMusicians() {
                loadingEl.classList.add('hidden');
                errorEl.classList.add('hidden');
                musiciansGridEl.classList.remove('hidden');
            }

            // Get base URL
            function getBaseUrl() {
                return window.location.origin;
            }

            // Create QR code
            function createQRCode(containerId, url) {
                const container = document.getElementById(containerId);
                container.innerHTML = ''; // Clear previous QR code

                new QRCode(container, {
                    text: url,
                    width: 256,
                    height: 256,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }

            // Download QR code as PNG
            function downloadQRCode(musicianId, musicianName) {
                const canvas = document.querySelector(`#qr-${musicianId} canvas`);
                if (!canvas) {
                    alert('QR code not found');
                    return;
                }

                // Convert canvas to blob and download
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `qr-code-${musicianId}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
            }

            // Create musician card
            function createMusicianCard(musician) {
                const baseUrl = getBaseUrl();
                const tipUrl = `${baseUrl}/tip/${musician.id}`;
                const setupUrl = `${baseUrl}/setup?musician_id=${musician.id}`;
                const qrId = `qr-${musician.id}`;

                const card = document.createElement('div');
                card.className = 'card';

                const statusBadge = musician.setupComplete
                    ? '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800">Setup Complete</span>'
                    : '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-yellow-100 text-yellow-800">Setup Incomplete</span>';

                card.innerHTML = `
                    <div class="p-6">
                        <div class="flex items-start justify-between mb-4">
                            <div>
                                <h2 class="text-2xl font-bold text-gray-900 mb-1">${musician.displayName}</h2>
                                <p class="text-gray-600">${musician.description}</p>
                            </div>
                            ${statusBadge}
                        </div>

                        <!-- QR Code -->
                        <div class="flex justify-center mb-4 bg-white p-4 rounded-lg border border-gray-200">
                            <div id="${qrId}"></div>
                        </div>

                        <!-- URLs -->
                        <div class="space-y-3 mb-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Tipping URL:</label>
                                <div class="flex items-center gap-2">
                                    <input
                                        type="text"
                                        value="${tipUrl}"
                                        readonly
                                        class="flex-1 px-3 py-2 text-sm bg-gray-50 border border-gray-300 rounded"
                                    >
                                    <button
                                        onclick="navigator.clipboard.writeText('${tipUrl}')"
                                        class="px-3 py-2 text-sm bg-gray-200 hover:bg-gray-300 rounded"
                                        title="Copy URL"
                                    >
                                        Copy
                                    </button>
                                </div>
                            </div>

                            ${!musician.setupComplete ? `
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Setup URL:</label>
                                <div class="flex items-center gap-2">
                                    <input
                                        type="text"
                                        value="${setupUrl}"
                                        readonly
                                        class="flex-1 px-3 py-2 text-sm bg-gray-50 border border-gray-300 rounded"
                                    >
                                    <button
                                        onclick="navigator.clipboard.writeText('${setupUrl}')"
                                        class="px-3 py-2 text-sm bg-gray-200 hover:bg-gray-300 rounded"
                                        title="Copy URL"
                                    >
                                        Copy
                                    </button>
                                </div>
                            </div>
                            ` : ''}
                        </div>

                        <!-- Actions -->
                        <div class="flex gap-2">
                            <button
                                onclick="window.downloadQRCode('${musician.id}', '${musician.displayName}')"
                                class="flex-1 btn-primary"
                            >
                                Download QR Code
                            </button>
                            <a
                                href="${tipUrl}"
                                target="_blank"
                                class="flex-1 btn-secondary text-center"
                            >
                                Test Page
                            </a>
                        </div>
                    </div>
                `;

                return card;
            }

            // Load musicians
            async function loadMusicians() {
                try {
                    const response = await fetch('/musicians/config.json');

                    if (!response.ok) {
                        throw new Error('Failed to load musician configuration');
                    }

                    const data = await response.json();

                    if (!data.musicians || data.musicians.length === 0) {
                        showError('No musicians found in configuration');
                        return;
                    }

                    // Clear grid
                    musiciansGridEl.innerHTML = '';

                    // Create cards for each musician
                    data.musicians.forEach(musician => {
                        const card = createMusicianCard(musician);
                        musiciansGridEl.appendChild(card);

                        // Generate QR code after card is in DOM
                        setTimeout(() => {
                            const baseUrl = getBaseUrl();
                            const tipUrl = `${baseUrl}/tip/${musician.id}`;
                            createQRCode(`qr-${musician.id}`, tipUrl);
                        }, 0);
                    });

                    showMusicians();

                } catch (error) {
                    console.error('Error loading musicians:', error);
                    showError(error.message || 'Failed to load musicians');
                }
            }

            // Make downloadQRCode available globally
            window.downloadQRCode = downloadQRCode;

            // Initialize
            loadMusicians();
        })();
    </script>
</body>
</html>
